<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Желтый фон -->
    <rect width="100" height="100" fill="#f2d024"/>
    
    <!-- Черные гранж-кляксы по углам (для стиля) -->
    <path d="M 0,0 L 25,0 C 20,10 15,15 0,20 Z" fill="#000"/>
    <path d="M 100,100 L 75,100 C 80,90 85,85 100,80 Z" fill="#000"/>
    
    <!-- Текст NAUM (трафаретный) -->
    <text x="50" y="55" font-family="Arial Black, Impact, sans-serif" font-size="38" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="2">N</text>
    
    <!-- Маленькая желтая точка для стиля -->
    <circle cx="50" cy="78" r="4" fill="#000"/>
</svg>
